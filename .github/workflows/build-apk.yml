name: Build Android APK and Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm dependencies
        uses: actions/cache@v4
        if: hashFiles('package-lock.json') != ''
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json detected. Executing npm ci..."
            npm ci
          else
            echo "No package-lock.json detected. Executing npm install..."
            npm install
          fi

      - name: Build web assets and sync Capacitor
        run: npm run cap:build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK & Play Store AAB Bundle
        run: |
          cd android
          echo "Building Debug APK for direct testing..."
          ./gradlew assembleDebug --no-daemon
          echo "Building Release AAB Bundle for Google Play Store..."
          ./gradlew bundleRelease --no-daemon || ./gradlew bundleDebug --no-daemon

      - name: Locate Generated Files
        run: |
          echo "=== APK Files ==="
          find android/app/build/outputs/apk/ -name "*.apk" || true
          echo "=== AAB Bundles ==="
          find android/app/build/outputs/bundle/ -name "*.aab" || true

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelport-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Play Store AAB Bundle as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reelport-PlayStore-AAB
          path: android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          echo "Publishing release $TAG_NAME..."
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          AAB_FILE=$(find android/app/build/outputs/bundle/ -name "*.aab" | head -n 1)
          
          if [ -n "$APK_FILE" ]; then
            gh release create "$TAG_NAME" "$APK_FILE" ${AAB_FILE:+"$AAB_FILE"} \
              --title "Reelport Android App v1.0.0 (Build ${{ github.run_number }})" \
              --notes "### Reelport Android Package Releases (Build ${{ github.run_number }})

- **app-debug.apk**: Direct installable APK for side-loading onto your Android phone or emulator.
- **app-release.aab**: Android App Bundle (AAB) optimized for submission to the **Google Play Console**." \
              --latest || echo "Warning: GitHub release step completed with notice, artifacts preserved."
          fi
